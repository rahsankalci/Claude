# =====================================================================
# OpenShift (coklu pod). Degerler ortam degiskenlerinden / Secret'lardan gelir.
# =====================================================================
kieserver.location=${KIE_SERVER_LOCATION:http://ih-dab-tanzim-fc-service:8090/rest/server}

# Her pod benzersiz transaction manager id kullanmali (Narayana kurtarma kayitlari karismasin)
narayana.transaction-manager-id=${HOSTNAME}

# Timer / async isler pod'lar arasi paylasilan DB uzerinden
jbpm.executor.enabled=true
jbpm.executor.retries=3
jbpm.executor.interval=5
jbpm.executor.threadPoolSize=2

spring.datasource.url=${DB_URL:jdbc:postgresql://postgresql:5432/ihdabtanzimfc}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Uretimde semayi BAMOE DDL scriptleriyle olusturup 'validate' kullanin
spring.jpa.properties.hibernate.hbm2ddl.auto=${HBM2DDL:validate}

# Avrasya servis adresleri handler tarafindan dogrudan ortam degiskenlerinden okunur:
#   AVRASYA_SERVICE_BASE_URL, AVRASYA_SERVICE_PROGRAM_<ProgramID>_URL,
#   AVRASYA_SERVICE_TIMEOUT_MS, AVRASYA_SERVICE_AUTH_HEADER (Secret)
