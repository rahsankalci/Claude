# =====================================================================
# IH_DAB_TANZIM_FC - Spring Boot KIE Server (gelistirme varsayilanlari)
# OpenShift icin: SPRING_PROFILES_ACTIVE=openshift (application-openshift.properties)
# =====================================================================
server.address=0.0.0.0
server.port=8090
cxf.path=/rest

# ---- KIE Server
kieserver.serverId=ih-dab-tanzim-fc-service
kieserver.serverName=ih-dab-tanzim-fc-service
kieserver.location=http://localhost:${server.port}/rest/server
kieserver.drools.enabled=true
kieserver.dmn.enabled=false
kieserver.jbpm.enabled=true
kieserver.jbpmui.enabled=false
kieserver.casemgmt.enabled=false
kieserver.optaplanner.enabled=false
kieserver.prometheus.enabled=false
kieserver.swagger.enabled=false
# kjar'lar uygulama classpath'inde (pom bagimliligi); Maven reposu gerekmez.
# Container'lar KieContainerTanimlari sinifinda (kbase secimiyle) tanimli.
kieserver.classPathContainer=true
bpm.kjar-version=@project.version@

# ---- jBPM
jbpm.executor.enabled=false

# ---- Veritabani (gelistirme: dosya tabanli H2)
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.url=jdbc:h2:./target/ih-dab-tanzim-fc-db;MVCC=TRUE
spring.datasource.driver-class-name=org.h2.Driver
narayana.dbcp.enabled=true
narayana.dbcp.maxTotal=20
narayana.transaction-manager-id=1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# ---- Avrasya servisleri (AvrasyaServiceWorkItemHandler)
# Tum ProgramID'ler icin ortak adres: <base-url>/<ProgramID>
avrasya.service.base-url=http://localhost:8091/avrasya
avrasya.service.timeout-ms=30000
# Program bazinda farkli adres gerekiyorsa:
#avrasya.service.program.116093.url=http://referans-servis/api/aciklama-ekle
#avrasya.service.program.116094.url=http://islem-servis/api/iptal
#avrasya.service.program.116092.url=http://onay-servis/api/onay-tablosu
#avrasya.service.program.116095.url=http://isistek-servis/api/update
#avrasya.service.program.179348.url=http://worldcheck-servis/api/kontrol

# Mainframe'e gidip BPM'e geri donen (asenkron) programlar: work item acik kalir,
# mainframe sonucu callback-url'e POST eder (AvrasyaGeriDonusController)
avrasya.service.program.269812.mode=async
avrasya.service.callback-url=http://localhost:${server.port}/api/avrasya/geri-donus
# EBR_BASIC_TEST programlari icin farkli adres gerekiyorsa:
#avrasya.service.program.54866.url=http://mainframe-gateway/avrasya/54866
#avrasya.service.program.269812.url=http://mainframe-gateway/avrasya/269812
# Yetkilendirme basligi (Secret'tan ortam degiskeni olarak: AVRASYA_SERVICE_AUTH_HEADER)
#avrasya.service.auth-header=

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
