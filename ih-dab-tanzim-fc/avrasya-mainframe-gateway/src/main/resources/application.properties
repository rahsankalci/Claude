server.port=8091
# simulator (gelistirme) | zos-connect (gercek mainframe)
gateway.connector=simulator
gateway.timeout-ms=60000

# Mainframe'e gidip BPM'e geri donen programlar
gateway.programs.269812.mode=async

# zos-connect icin program adresleri (z/OS Connect EE API'leri):
#gateway.programs.54866.url=https://zosconnect:9443/avrasya/referans-aciklama-ekle
#gateway.programs.269812.url=https://zosconnect:9443/ebr/webclient
#gateway.programs.116093.url=...
#gateway.programs.116094.url=...
#gateway.programs.116092.url=...
#gateway.programs.116095.url=...
#gateway.programs.179348.url=...

# BPM geri donus kimligi (BPM tarafinda 'mainframe' yetkisi). Uretimde Secret'tan:
gateway.bpm.username=${GATEWAY_BPM_USERNAME:mainframe}
gateway.bpm.password=${GATEWAY_BPM_PASSWORD:mainframe}

management.endpoints.web.exposure.include=health,info
